name: CI
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.integration.config.ts"
      - "tsconfig*.json"
      - ".eslintrc*"
      - ".prettierrc*"
      - ".github/workflows/ci.yml"
      - ".github/workflows/lint-check.yml"
      - ".github/workflows/test-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vitest.integration.config.ts"
      - "tsconfig*.json"
      - ".eslintrc*"
      - ".prettierrc*"
      - ".github/workflows/ci.yml"
      - ".github/workflows/lint-check.yml"
      - ".github/workflows/test-build.yml"

jobs:
  # audit / type-check / lint を直列で実行（軽量グループ、〜20秒）
  lint-check:
    # release-please PR は main マージ前に CI 済みのため再実行不要。
    # fork 偽装防止: head repo + PR 作成者の両方を確認する。
    if: >-
      !(startsWith(github.head_ref, 'release-please--') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'beginerbeginer')
    uses: ./.github/workflows/lint-check.yml

  # test:coverage + build を直列で実行（重量グループ、〜60秒）
  test-build:
    # release-please PR は main マージ前に CI 済みのため再実行不要。
    # fork 偽装防止: head repo + PR 作成者の両方を確認する。
    if: >-
      !(startsWith(github.head_ref, 'release-please--') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == 'beginerbeginer')
    uses: ./.github/workflows/test-build.yml

  # 両グループ完了後に PR コメントへ表テーブルを投稿
  report:
    needs: [lint-check, test-build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-artifacts
          path: .
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function icon(result) {
              return result === 'success' ? '✅' : result === 'failure' ? '❌' : '⏭️';
            }

            const results = {
              lintCheck: '${{ needs.lint-check.result }}',
              testBuild: '${{ needs.test-build.result }}',
            };

            let unitDetail = '';
            try {
              const raw = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const { numPassedTests, numFailedTests, numTotalTests } = raw;
              unitDetail = `${numPassedTests}/${numTotalTests} passed`;
              if (numFailedTests > 0) unitDetail += `, **${numFailedTests} failed**`;
            } catch (_) {}

            let integrationDetail = '';
            try {
              const raw = JSON.parse(fs.readFileSync('integration-test-results.json', 'utf8'));
              const { numPassedTests, numFailedTests, numTotalTests } = raw;
              integrationDetail = `${numPassedTests}/${numTotalTests} passed`;
              if (numFailedTests > 0) integrationDetail += `, **${numFailedTests} failed**`;
            } catch (_) {}

            let coverageDetail = '';
            try {
              const cov = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const t = cov.total;
              coverageDetail = `Lines ${t.lines.pct}% | Stmts ${t.statements.pct}% | Branch ${t.branches.pct}% | Funcs ${t.functions.pct}%`;
            } catch (_) {}

            const allPassed = Object.values(results).every(r => r === 'success' || r === 'skipped');
            const headline = allPassed ? '✅ All checks passed' : '❌ Some checks failed';

            const body = [
              '<!-- ci-report -->',
              `## CI: ${headline}`,
              '',
              '| グループ | 結果 | 内容 |',
              '|---------|:----:|------|',
              `| Lint Check | ${icon(results.lintCheck)} | audit / type-check / lint |`,
              `| Unit Tests | ${icon(results.testBuild)} | ${unitDetail || 'N/A'} |`,
              `| Integration Tests | ${icon(results.testBuild)} | ${integrationDetail || 'N/A'} |`,
              `| Coverage | — | ${coverageDetail || 'N/A'} |`,
            ].join('\n');

            // fork PR では GITHUB_TOKEN が read-only のためコメント投稿をスキップ
            if (context.payload.pull_request.head.repo.fork) {
              core.info('Skipping PR comment: token is read-only on fork PRs');
              return;
            }

            // per_page=100 でデフォルト 30 件制限によるマーカー未検出を回避
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes('<!-- ci-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
