name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 各チェックを責務ごとのワークフローとして並行実行
  audit:
    uses: ./.github/workflows/audit.yml

  type-check:
    uses: ./.github/workflows/type-check.yml

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  # 全ジョブ完了後に PR コメントへ表テーブルを投稿
  report:
    needs: [audit, type-check, lint, test, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-artifacts
          path: .
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function icon(result) {
              return result === 'success' ? '✅' : result === 'failure' ? '❌' : '⏭️';
            }

            const results = {
              audit:     '${{ needs.audit.result }}',
              typeCheck: '${{ needs.type-check.result }}',
              lint:      '${{ needs.lint.result }}',
              test:      '${{ needs.test.result }}',
              build:     '${{ needs.build.result }}',
            };

            let testDetail = '';
            try {
              const raw = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const { numPassedTests, numFailedTests, numTotalTests } = raw;
              testDetail = `${numPassedTests}/${numTotalTests} passed`;
              if (numFailedTests > 0) testDetail += `, **${numFailedTests} failed**`;
            } catch (_) {}

            let coverageDetail = '';
            try {
              const cov = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const t = cov.total;
              coverageDetail = `Lines ${t.lines.pct}% | Stmts ${t.statements.pct}% | Branch ${t.branches.pct}% | Funcs ${t.functions.pct}%`;
            } catch (_) {}

            const allPassed = Object.values(results).every(r => r === 'success');
            const headline = allPassed ? '✅ All checks passed' : '❌ Some checks failed';

            const body = [
              '<!-- ci-report -->',
              `## CI: ${headline}`,
              '',
              '| ジョブ | 結果 | 詳細 |',
              '|--------|:----:|------|',
              `| npm audit | ${icon(results.audit)} | セキュリティ脆弱性チェック |`,
              `| Type check | ${icon(results.typeCheck)} | TypeScript 型整合性 |`,
              `| Lint | ${icon(results.lint)} | コードスタイル |`,
              `| Tests | ${icon(results.test)} | ${testDetail} |`,
              `| Build | ${icon(results.build)} | プロダクションビルド |`,
              `| Coverage | — | ${coverageDetail || 'N/A'} |`,
            ].join('\n');

            // fork PR では GITHUB_TOKEN が read-only のためコメント投稿をスキップ
            if (context.payload.pull_request.head.repo.fork) {
              core.info('Skipping PR comment: token is read-only on fork PRs');
              return;
            }

            // per_page=100 でデフォルト 30 件制限によるマーカー未検出を回避
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.includes('<!-- ci-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
