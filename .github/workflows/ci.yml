name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # npm audit は package-lock.json だけ読むので node_modules 不要
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # high 以上の既知脆弱性があれば CI を失敗させる
      - run: npm audit --audit-level=high

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # postinstall スクリプトを無効化してサプライチェーン攻撃を緩和
      - run: npm ci --ignore-scripts
      - run: npm run type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # テスト結果（JSON）とカバレッジ（json-summary）を一度に出力
      - run: npm run test:coverage -- --reporter=json --outputFile=test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            test-results.json
            coverage/coverage-summary.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  # 全ジョブ完了後に PR コメントへ表テーブルを投稿
  report:
    needs: [audit, type-check, lint, test, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-artifacts
          path: .
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function icon(result) {
              return result === 'success' ? '✅' : result === 'failure' ? '❌' : '⏭️';
            }

            const results = {
              audit:     '${{ needs.audit.result }}',
              typeCheck: '${{ needs.type-check.result }}',
              lint:      '${{ needs.lint.result }}',
              test:      '${{ needs.test.result }}',
              build:     '${{ needs.build.result }}',
            };

            let testDetail = '';
            try {
              const raw = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const { numPassedTests, numFailedTests, numTotalTests } = raw;
              testDetail = `${numPassedTests}/${numTotalTests} passed`;
              if (numFailedTests > 0) testDetail += `, **${numFailedTests} failed**`;
            } catch (_) {}

            let coverageDetail = '';
            try {
              const cov = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const t = cov.total;
              coverageDetail = `Lines ${t.lines.pct}% | Stmts ${t.statements.pct}% | Branch ${t.branches.pct}% | Funcs ${t.functions.pct}%`;
            } catch (_) {}

            const allPassed = Object.values(results).every(r => r === 'success');
            const headline = allPassed ? '✅ All checks passed' : '❌ Some checks failed';

            const body = [
              '<!-- ci-report -->',
              `## CI: ${headline}`,
              '',
              '| ジョブ | 結果 | 詳細 |',
              '|--------|:----:|------|',
              `| npm audit | ${icon(results.audit)} | セキュリティ脆弱性チェック |`,
              `| Type check | ${icon(results.typeCheck)} | TypeScript 型整合性 |`,
              `| Lint | ${icon(results.lint)} | コードスタイル |`,
              `| Tests | ${icon(results.test)} | ${testDetail} |`,
              `| Build | ${icon(results.build)} | プロダクションビルド |`,
              `| Coverage | — | ${coverageDetail || 'N/A'} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- ci-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
