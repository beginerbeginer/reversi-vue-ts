name: Lint Check
on:
  workflow_call: {}

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # high 以上の既知脆弱性があれば CI を失敗させる（node_modules 不要）
      - run: npm audit --audit-level=high
      # postinstall スクリプトを無効化してサプライチェーン攻撃を緩和
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm run lint
      - run: npm run knip
