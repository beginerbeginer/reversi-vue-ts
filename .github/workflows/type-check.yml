name: Type Check
on:
  workflow_call: {}

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # postinstall スクリプトを無効化してサプライチェーン攻撃を緩和
      - run: npm ci --ignore-scripts
      - run: npm run type-check
