name: Audit
on:
  workflow_call: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # high 以上の既知脆弱性があれば CI を失敗させる
      - run: npm audit --audit-level=high
